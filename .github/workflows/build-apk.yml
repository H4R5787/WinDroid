name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build WinDroid APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses and Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log || {
            kot_err=$(grep -A 2 -E "(e: |FAILED|Compilation error)" build.log | head -n 15 | tr '\r\n' '  ' | cut -c 1-1500)
            if [ -z "$kot_err" ]; then
              kot_err=$(tail -n 25 build.log | tr '\r\n' '  ' | cut -c 1-1500)
            fi
            echo "::error title=BuildError::$kot_err"
            exit 1
          }

      - name: Locate and Prepare APK
        run: |
          tasks_ran=$(grep -E "> Task " build.log | tail -n 20 | tr '\r\n' '  ')
          echo "::warning title=TasksRan::$tasks_ran"
          build_files=$(find app/build -maxdepth 4 | tail -n 30 | tr '\r\n' '  ')
          echo "::warning title=BuildFiles::$build_files"
          mkdir -p dist
          APK_PATH=$(find . -name "*.apk" -not -path "*/.*" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK file found anywhere in repository"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" dist/WinDroid-debug.apk
          ls -lh dist/WinDroid-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windroid-debug-apk
          path: dist/WinDroid-debug.apk
          retention-days: 30

      - name: Commit and Push APK to release-apk branch
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B release-apk
          mkdir -p release
          cp dist/WinDroid-debug.apk release/WinDroid-debug.apk
          git add release/WinDroid-debug.apk
          git commit -m "build(release): automated WinDroid debug APK"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git release-apk --force || true

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha
          name: "WinDroid v0.1.0-alpha (ARM64)"
          body: |
            ### WinDroid Android Compatibility Runtime 🎮🚀
            
            Automated build for Android ARM64 devices:
            - **Target SDK**: Android 14 (API 34)
            - **Minimum SDK**: Android 9.0 (API 28)
            - **Architecture**: `arm64-v8a`
            - **Translation Core**: Wine WoW64 + Box64 Dynarec + DXVK 2.3.1
            
            #### Download:
            Install the attached `WinDroid-debug.apk` directly on your ARM64 Android device.
          draft: false
          prerelease: true
          files: dist/WinDroid-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
